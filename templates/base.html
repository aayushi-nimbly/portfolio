<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ profile.name }} | Portfolio{% endblock %}</title>
<meta name="description" content="{% block description %}{{ profile.intro }}{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="{{ url_for('index') }}">{{ profile.name }}</a>
    <ul>
      <li><a href="{{ url_for('index') }}#projects">Projects</a></li>
      {% if profile.experience %}<li><a href="{{ url_for('index') }}#experience">Experience</a></li>{% endif %}
      {% if profile.skills %}<li><a href="{{ url_for('index') }}#skills">Skills</a></li>{% endif %}
      <li><a href="{{ url_for('index') }}#contact">Contact</a></li>
    </ul>
  </nav>

{% block content %}{% endblock %}

  <footer>© {{ year }} {{ profile.name }}</footer>
</div>
</body>
</html>
